name: Daily GHIN Snapshot

on:
  schedule:
    # 14:00 UTC = 07:00 PT / 10:00 ET. Cron is best-effort; can be delayed.
    - cron: '0 14 * * *'
  workflow_dispatch: {}  # also runnable manually from the Actions tab

permissions:
  contents: write  # required so the job can commit data.json back to main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run snapshot script
        env:
          GHIN_USER: ${{ secrets.GHIN_USER }}
          GHIN_PASSWORD: ${{ secrets.GHIN_PASSWORD }}
        run: node scripts/snapshot.mjs

      - name: Commit if data.json changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d)"
            git push
          fi
